# ---
# Set prefix as Control-Space instead of Control-b [13]
# ---
unbind C-b
set-option -g prefix C-Space
bind-key C-Space send-prefix

# ---
# Panes
# ---

# Set new panes to open in current directory [2, 9, 10, 14]
bind c new-window -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
unbind '"'
unbind %

# switch panes using Alt-arrow without prefix [2]
# bind -n M-Left select-pane -L
# bind -n M-Right select-pane -R
# bind -n M-Up select-pane -U
# bind -n M-Down select-pane -D

# Set Tmux status bar to top
set-option -g status-position top

# Using vim tmux navigator
set -g @vim_navigator_mapping_left "C-Left C-h"  # use C-h and C-Left
set -g @vim_navigator_mapping_right "C-Right C-l"
set -g @vim_navigator_mapping_up "C-k"
set -g @vim_navigator_mapping_down "C-j"
set -g @vim_navigator_mapping_prev "C-g"  # removes the C-\ binding

# Use Shift + Left (resp. Right) to go to previous (resp. next) window [15, 16]
# bind "h"  previous-window
# bind "l" next-window
# bind "k" switch-client -n
# bind "j" switch-client -p
#
bind -n C-` split-window -c "#{pane_current_path}" -l 20

# To previous window
bind h previous-window
bind l next-window
bind j select-window -l

# ---
# Vim-Like Selection in Copy Mode
# ---

setw -g mode-keys vi
bind v copy-mode
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi V send -X select-line
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel 'pbcopy'

# Vim-Like movements
# MEH + j send down arrow
bind-key -n C-S-M-j send-keys Down
# MEH + k send up arrow
bind-key -n C-S-M-k send-keys Up


# ---
# Display Popup
# ---

# Lazygit
unbind b
bind b display-popup \
	-d "#{pane_current_path}" \
	-w 85% \
	-h 85% \
	-E "SSH_AUTH_SOCK=\$HOME/.gnupg/S.gpg-agent.ssh lazygit --use-config-file \$HOME/.config/lazygit/config.yml"

# Scratch Terminal
# unbind t
# bind t display-popup \
# 	-d "#{pane_current_path}" \
# 	-w 85% \
# 	-h 85% \
# 	-E "tmux attach -t scratch-term || tmux new -s scratch-term"

# Tuxedo
unbind t
bind t display-popup \
	-d "#{pane_current_path}" \
	-w 85% \
	-h 85% \
	-E "tuxedo"

# Serpl
unbind s
bind s display-popup \
	-d "#{pane_current_path}" \
	-w 85% \
	-h 85% \
	-E "serpl"

# TV
unbind T
bind T display-popup \
	-d "#{pane_current_path}" \
	-w 85% \
	-h 85% \
	-E "tv"

# Spotify-player
unbind p
bind p display-popup \
	-d "#{pane_current_path}" \
	-w 85% \
	-h 85% \
	-E "spotify_player"

# If nothing shows up,
# 1. Check is `tv` is installed
# 2. Run `tv update-channels --force`
# 3. Check if it's working with `tv sesh`
unbind Space
bind-key "Space" display-popup -E -w 80% -h 70% -d '#{pane_current_path}' -T 'Sesh' tv sesh

# jira issue list -tEpic -s"To Do" -s"InProgress" --created -90d --order-by rank --reverse

# ---
# Reload Config File
# ---

# reload config file (change file location to your the tmux.conf you want to use) [2]
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# ---
# Enable mouse mode (tmux 2.1 and above) [2,4,5]
# ---
set -g mouse on

set -g set-clipboard on # [7]

# ---
# Shell management. [8]
# ---

# Set the default shell, and set the default command to use our shell (this
# means we source things properly, show the correct PS1 etc).
set -g default-shell ${SHELL}

# set-option -g default-shell /bin/zsh # [6]
set -g default-command ${SHELL}


# ---
# Display [7]
# ---
set -g renumber-windows on    # renumber windows when a window is closed

# Set window notifications [7]
set -g monitor-activity on
set -g visual-activity on

# Colour management (yikes) and alert management.

# Set 256 colors [11, 17]
set -s default-terminal 'tmux-256color'
set -as terminal-features ",*:RGB"
set -ag terminal-overrides ",xterm-256color:RGB"
set -ag terminal-overrides ",xterm-ghostty:RGB"
set -g allow-passthrough on
set-environment -g COLORTERM truecolor

# Enable undercurl [17]
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'

# Enable undercurl colors [17]
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# Rename session with current folder [12]
set-option -g status-interval 5
set-option -g automatic-rename on
set-option -g automatic-rename-format '#{b:pane_current_path}'

# Set base index for windows to 1 [13]
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows 1


# ---
# Configuration for git-gutter vim plugin
# ---
set -g focus-events on

# ---
# Tmuxinator Plugin Settings
# ---

# Tmuxinator mode on
set -g @sessionx-tmuxinator-mode 'on'


# ---
# Plugins
# ---

# Set TPM path [18]
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.tmux/plugins/'

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'joshmedeski/tmux-nerd-font-window-name'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'omerxx/tmux-sessionx'
set -g @continuum-restore 'on' # Set autosave session to on
set -g @plugin 'sainnhe/tmux-fzf' # To launch tmux-fzf, press prefix + F (Shift+F).
set -g @plugin 'jaclu/tmux-menus' # The default is <prefix> \
set -g @plugin 'laktak/extrakto' # Use with prefix + tab

# ---
# Setup treemux plugin
# ---
set -g @treemux-tree-nvim-init-file '~/.tmux/plugins/treemux/configs/treemux_init.lua'
# If you want to completely isolate the treemux's nvim config and data from your main nvim config and data, set NVIM_APPNAME.
# This will make treemux use '~/.config/nvim-treemux', '~/.local/share/nvim-treemux'
# Keep the next command before the kiyoon/treemx line
set -g @treemux-nvim-command 'NVIM_APPNAME=nvim-treemux nvim'  # default is 'nvim'
set -g @plugin 'kiyoon/treemux'

# ---
# Setup Gruvbox Plugin
#
# References:
# 	[1] https://github.com/egel/tmux-gruvbox
# ---
# set -g @plugin 'egel/tmux-gruvbox'
# set -g @tmux-gruvbox 'dark256'
#
# # Set date in EU notation
# set -g @tmux-gruvbox-right-status-x '%Y-%m-%d' # e.g.: 30.01.2024
# set -g @tmux-gruvbox-right-status-z '#h #{tmux_mode_indicator}'
#
# ---
# Setup tmux sessionx
#
# References:
#		[1] https://github.com/omerxx/tmux-sessionx
# ---
set -g @sessionx-bind 'o'

# ---
# Setup TokyoNight Plugin
#
# References:
# 	[1] https://github.com/folke/tokyonight.nvim/blob/main/extras/tmux/tokyonight_night.tmux
# ---

set -g mode-style "fg=#7aa2f7,bg=#24293b"

set -g message-style "fg=#7aa2f7,bg=#24293b"
set -g message-command-style "fg=#7aa2f7,bg=#24293b"

set -g pane-border-style "fg=#24293b"
set -g pane-active-border-style "fg=#7aa2f7"
set -g pane-border-status top
set -g pane-border-format " #P: #{pane_current_command} "

# Dim inactive panes, keep active pane at full brightness
set -g window-style 'fg=colour245,bg=#141622'
set -g window-active-style 'fg=colour255,bg=#16161e'

set -g status "on"
set -g status-justify "left"

set -g status-style "fg=#7aa2f7,bg=#16161e"

set -g status-left-length "100"
set -g status-right-length "100"

set -g status-left-style NONE
set -g status-right-style NONE

set -g status-left "#[fg=#7aa2f7,bg=#24293b,bold] #S #[fg=#24293b,bg=#16161e,nobold,nounderscore,noitalics]" # This is the session name
set -g status-right "#[fg=#16161e,bg=#16161e,nobold,nounderscore,noitalics]#[fg=#7aa2f7,bg=#16161e] #{prefix_highlight} #[fg=#24293b,bg=#16161e,nobold,nounderscore,noitalics]#[fg=#7aa2f7,bg=#24293b] %Y-%m-%d  %I:%M %p #[fg=#7aa2f7,bg=#24293b,nobold,nounderscore,noitalics]#[fg=#15161e,bg=#7aa2f7,bold] #h "
if-shell '[ "$(tmux show-option -gqv "clock-mode-style")" == "24" ]' {
  set -g status-right "#[fg=#16161e,bg=#16161e,nobold,nounderscore,noitalics]#[fg=#7aa2f7,bg=#16161e] #{prefix_highlight} #[fg=#24293b,bg=#16161e,nobold,nounderscore,noitalics]#[fg=#7aa2f7,bg=#24293b] %Y-%m-%d  %H:%M "
}

setw -g window-status-activity-style "nounderscore,fg=#7aa2f7,bg=#24293b"
setw -g window-status-separator ""
setw -g window-status-style "NONE,fg=#7aa2f7,bg=#24293b"
setw -g window-status-format "#[fg=#1a1b26,bg=#24293b,nobold,nounderscore,noitalics]#[default] #I  #W #[fg=#24293b,bg=#1a1b26,nobold,nounderscore,noitalics]"
setw -g window-status-current-format "#[fg=#15161e,bg=#7aa2f7,nobold,nounderscore,noitalics]#[fg=#24293b,bg=#7aa2f7,bold] #I  #W #[fg=#7aa2f7,bg=#1a1b26,nobold,nounderscore,noitalics]"

# tmux-plugins/tmux-prefix-highlight support
set -g @prefix_highlight_output_prefix "#[fg=#e0af68]#[bg=#16161e]#[fg=#16161e]#[bg=#e0af68]"
set -g @prefix_highlight_output_suffix ""

